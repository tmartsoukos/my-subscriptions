<title>Το Dashboard μου</title>
<script>
  // Εφαρμογή θέματος πριν την πρώτη ζωγραφιά, ώστε να μην αναβοσβήνει
  (function () {
    var mode = localStorage.getItem("pref:theme") || "system";
    var eff = mode === "system"
      ? (window.matchMedia("(prefers-color-scheme: light)").matches ? "light" : "dark")
      : mode;
    document.documentElement.dataset.theme = eff;
    document.documentElement.dataset.density = localStorage.getItem("pref:density") || "comfortable";
    document.documentElement.style.colorScheme = eff;
    // Χρώμα τόνου πριν την πρώτη ζωγραφιά
    var accents = {
      blue:["#3b82f6","#7c6cf6","#2563eb","#6d5cf0"], violet:["#8b5cf6","#d946a6","#7c3aed","#c026a3"],
      green:["#22b07d","#4c8dff","#0f9d63","#2563eb"], amber:["#e08b2f","#e2585c","#c2710f","#d1373c"],
      rose:["#e0518f","#8b5cf6","#d02b73","#7c3aed"], teal:["#14a3b8","#3b82f6","#0e8ba0","#2563eb"]
    };
    var a = accents[localStorage.getItem("pref:accent") || "blue"] || accents.blue;
    var c1 = eff === "light" ? a[2] : a[0], c2 = eff === "light" ? a[3] : a[1];
    var rs = document.documentElement.style;
    // Ζωντανό φως: το φόντο ζεσταίνει ή δροσίζει ανάλογα με τους στόχους
    var mood = localStorage.getItem("pref:moodon") !== "0" ? Number(localStorage.getItem("pref:mood")) || 0 : 0;
    var mrgb = mood >= 0 ? "34, 176, 125" : "224, 145, 47";
    var ma = Math.min(Math.abs(mood), 1) * (eff === "light" ? 0.13 : 0.17);
    rs.setProperty("--mood-a", "rgba(" + mrgb + ", " + ma.toFixed(3) + ")");
    rs.setProperty("--mood-b", "rgba(" + mrgb + ", " + (ma * 0.65).toFixed(3) + ")");
    rs.setProperty("--accent", c1);
    rs.setProperty("--accent2", c2);
    rs.setProperty("--accent-grad", "linear-gradient(135deg, " + c1 + ", " + c2 + ")");
    rs.setProperty("--glow", eff === "light" ? "0 2px 12px " + c1 + "33" : "0 0 24px " + c1 + "59");
  })();
</script>

<body>

<!-- Οθόνη σύνδεσης -->
<div id="authScreen" class="auth-screen hidden">
  <div class="auth-card">
    <div class="auth-logo"></div>
    <h1>Το <span>Dashboard</span> μου</h1>
    <p class="auth-sub">Συνδρομές · Εργασίες · Ημερολόγιο · Σημειώσεις</p>
    <form id="authForm">
      <div class="field">
        <label for="authEmail">Email</label>
        <input type="email" id="authEmail" autocomplete="email" required>
      </div>
      <div class="field">
        <label for="authPass">Κωδικός</label>
        <div class="pass-wrap">
          <input type="password" id="authPass" autocomplete="current-password" minlength="6" required>
          <button type="button" id="togglePass" class="icon-btn" aria-label="Εμφάνιση κωδικού"></button>
        </div>
      </div>
      <p id="authError" class="auth-error" role="alert"></p>
      <button type="submit" class="btn btn-primary btn-block" id="btnLogin">Σύνδεση</button>
      <button type="button" class="btn btn-ghost btn-block" id="btnSignup">Δημιουργία λογαριασμού</button>
    </form>
  </div>
</div>
