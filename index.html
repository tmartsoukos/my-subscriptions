<!DOCTYPE html>
<html lang="el">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="theme-color" content="#070d1f">
<link rel="manifest" href="manifest.json">
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="icon-192.png">
<link rel="stylesheet" href="css/app.css">
<title>Το Dashboard μου</title>
<script>
  // Εφαρμογή θέματος πριν την πρώτη ζωγραφιά, ώστε να μην αναβοσβήνει
  (function () {
    var mode = localStorage.getItem("pref:theme") || "system";
    var eff = mode === "system"
      ? (window.matchMedia("(prefers-color-scheme: light)").matches ? "light" : "dark")
      : mode;
    document.documentElement.dataset.theme = eff;
    document.documentElement.dataset.density = localStorage.getItem("pref:density") || "comfortable";
    document.documentElement.style.colorScheme = eff;
  })();
</script>
</head>
<body>

<!-- Οθόνη σύνδεσης -->
<div id="authScreen" class="auth-screen hidden">
  <div class="auth-card">
    <div class="auth-logo"></div>
    <h1>Το <span>Dashboard</span> μου</h1>
    <p class="auth-sub">Συνδρομές · Εργασίες · Ημερολόγιο · Σημειώσεις</p>
    <form id="authForm">
      <div class="field">
        <label for="authEmail">Email</label>
        <input type="email" id="authEmail" autocomplete="email" required>
      </div>
      <div class="field">
        <label for="authPass">Κωδικός</label>
        <div class="pass-wrap">
          <input type="password" id="authPass" autocomplete="current-password" minlength="6" required>
          <button type="button" id="togglePass" class="icon-btn" aria-label="Εμφάνιση κωδικού"></button>
        </div>
      </div>
      <p id="authError" class="auth-error" role="alert"></p>
      <button type="submit" class="btn btn-primary btn-block" id="btnLogin">Σύνδεση</button>
      <button type="button" class="btn btn-ghost btn-block" id="btnSignup">Δημιουργία λογαριασμού</button>
    </form>
  </div>
</div>

<!-- Κυρίως εφαρμογή -->
<div id="app" class="app hidden">
  <aside class="sidebar">
    <div class="brand">
      <img src="icon-192.png" alt="" width="34" height="34">
      <span>Dashboard</span>
    </div>
    <nav class="side-nav" aria-label="Κύρια πλοήγηση">
      <a href="#/dashboard" data-route="dashboard"><span class="nav-ico" data-ico="home"></span>Επισκόπηση</a>
      <a href="#/subs" data-route="subs"><span class="nav-ico" data-ico="card"></span>Συνδρομές</a>
      <a href="#/todos" data-route="todos"><span class="nav-ico" data-ico="check"></span>Εργασίες</a>
      <a href="#/calendar" data-route="calendar"><span class="nav-ico" data-ico="calendar"></span>Ημερολόγιο</a>
      <a href="#/notes" data-route="notes"><span class="nav-ico" data-ico="note"></span>Σημειώσεις</a>
      <a href="#/studies" data-route="studies"><span class="nav-ico" data-ico="book"></span>Σπουδές</a>
      <a href="#/health" data-route="health"><span class="nav-ico" data-ico="heart"></span>Υγεία</a>
      <a href="#/watchlist" data-route="watchlist"><span class="nav-ico" data-ico="bookmark"></span>Λίστα</a>
    </nav>
    <div class="side-bottom">
      <a href="#/settings" data-route="settings"><span class="nav-ico" data-ico="settings"></span>Ρυθμίσεις</a>
      <button id="btnLogout" class="side-logout"><span class="nav-ico" data-ico="logout"></span>Αποσύνδεση</button>
    </div>
  </aside>

  <div class="main-col">
    <header class="mobile-header">
      <div class="brand"><img src="icon-192.png" alt="" width="28" height="28"><span>Dashboard</span></div>
      <a href="#/settings" class="icon-btn" aria-label="Ρυθμίσεις"><span class="nav-ico" data-ico="settings"></span></a>
    </header>
    <div id="offlineBanner" class="offline-banner hidden">Εκτός σύνδεσης — προβολή αποθηκευμένων δεδομένων (μόνο ανάγνωση)</div>
    <main id="view" tabindex="-1"></main>
  </div>

  <nav class="tabbar" aria-label="Πλοήγηση κινητού">
    <a href="#/dashboard" data-route="dashboard"><span class="nav-ico" data-ico="home"></span><span>Αρχική</span></a>
    <a href="#/subs" data-route="subs"><span class="nav-ico" data-ico="card"></span><span>Συνδρομές</span></a>
    <a href="#/todos" data-route="todos"><span class="nav-ico" data-ico="check"></span><span>Εργασίες</span></a>
    <a href="#/calendar" data-route="calendar"><span class="nav-ico" data-ico="calendar"></span><span>Ημ/γιο</span></a>
    <a href="#/more" data-route="more"><span class="nav-ico" data-ico="dots"></span><span>Περισσότερα</span></a>
  </nav>
</div>

<div id="modalRoot"></div>
<div id="toastRoot" aria-live="polite"></div>

<script src="js/vendor/supabase.min.js"></script>
<script type="module" src="js/main.js"></script>
</body>
</html>
